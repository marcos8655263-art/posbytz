<head>

<title>PosBytz • Gestão de Restaurante</title>
<style>
:root{--orange:#f47b20;--orange2:#fff0e4;--ink:#20242b;--muted:#747b86;--line:#eceef1;--bg:#f7f8fa;--green:#15965b;--red:#d94c4c}
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:var(--orange);color:#fff;font-weight:650}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red);border:1px solid #ffd7d7}input,select{border:1px solid #dfe3e8;border-radius:9px;padding:10px;background:white;min-width:0}h1,h2,h3,p{margin:0}h1{font-size:23px}h2{font-size:16px}small,.muted{color:var(--muted)}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-size:25px;font-weight:850;margin:0 12px 25px}.brand span{color:var(--orange)}.nav{display:flex;gap:12px;align-items:center;text-align:left;background:transparent;color:#4d535c;padding:12px;border-radius:10px;font-weight:550}.nav.active,.nav:hover{background:var(--orange2);color:#d9610a}.nav .ico{width:22px;text-align:center;font-size:18px}.sidebar-foot{margin-top:auto;padding:12px;color:var(--muted);font-size:12px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.topright{display:flex;align-items:center;gap:10px}.content{padding:27px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.pagehead p{color:var(--muted);margin-top:6px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0;box-shadow:0 2px 8px #20242b05}.stat{display:flex;gap:13px;align-items:flex-start}.stat-icon{width:43px;height:43px;border-radius:12px;background:var(--orange2);display:grid;place-items:center;font-size:21px;color:var(--orange);flex-shrink:0}.stat label{color:var(--muted);font-size:12px}.value{font-size:23px;font-weight:800;margin:7px 0}.green{color:var(--green)}.red{color:var(--red)}.two{grid-template-columns:1.15fr 1fr;margin-bottom:18px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;gap:10px}.chart{height:220px;display:flex;align-items:end;gap:10px;border-bottom:1px solid var(--line);padding:12px 4px 0}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;min-width:0}.bar{width:min(32px,80%);border-radius:7px 7px 0 0;background:linear-gradient(180deg,#ffab66,var(--orange));min-height:4px}.bar-wrap small{font-size:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted);font-weight:600;background:#fcfcfd}td strong{font-weight:700}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef8f1;color:#167747;font-size:11px;font-weight:700}.pill.warn{background:#fff4df;color:#a66a00}.pill.off{background:#f0f1f3;color:#606875}.row-actions{display:flex;gap:7px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:170px}.products{grid-template-columns:repeat(4,minmax(0,1fr))}.product{display:flex;flex-direction:column;gap:9px}.product .emoji{font-size:30px;background:#fff5eb;border-radius:12px;padding:14px;text-align:center}.product .price{font-weight:800;font-size:18px}.product button{width:100%}.pos-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:6px;align-items:center}.qty button{padding:4px 9px;border-radius:7px}.totalrow{display:flex;justify-content:space-between;margin:12px 0}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{background:#fff7ed;border:1px solid #ffdfc2;color:#8d4b16;padding:12px;border-radius:10px;margin-bottom:16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#11182780;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{background:white;border-radius:16px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.toast{position:fixed;right:20px;bottom:20px;background:#20242b;color:white;padding:13px 18px;border-radius:10px;display:none;z-index:9}.mobile-menu{display:none}.footer-note{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.products{grid-template-columns:repeat(3,minmax(0,1fr))}.three{grid-template-columns:1fr}.app{grid-template-columns:190px 1fr}.content{padding:20px}}
@media(max-width:700px){.app{display:block}.sidebar{display:none;position:fixed;z-index:6;top:0;bottom:0;left:0;width:245px;box-shadow:0 0 0 999px #0006}.sidebar.open{display:flex}.mobile-menu{display:inline-block}.topbar{padding:0 14px;height:65px}.content{padding:16px}.pagehead{align-items:flex-start;flex-direction:column}.stats{gap:10px}.stat{padding:13px}.stat-icon{display:none}.value{font-size:19px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.pos-layout{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.topright select{max-width:120px}.card{padding:14px}.brand{margin-bottom:10px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
#authGate{position:fixed;inset:0;background:#f7f8fa;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}

#authGate .field{margin:12px 0}#authGate button{width:100%;margin-top:8px}

<body>
<div id="authGate">
  <div class="auth-card">
    <div class="brand" style="margin:0 0 18px">Pos<span style="color:#f47b20">Bytz</span></div>

<div class="app" id="posApp" style="visibility:hidden">
<aside class="sidebar" id="sidebar">
<div class="brand">Pos<span>Bytz</span></div>
<button class="nav active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
<button class="nav" data-page="pos"><span class="ico">▣</span>Frente de caixa</button>
<button class="nav" data-page="orders"><span class="ico">☷</span>Pedidos</button>
<button class="nav" data-page="comandas"><span class="ico">🍽</span>Mesas e comandas</button>
<button class="nav" data-page="waiters"><span class="ico">♙</span>Garçons</button>
<button class="nav" data-page="inventory"><span class="ico">▤</span>Estoque</button>
<button class="nav" data-page="products"><span class="ico">♧</span>Produtos</button>
<button class="nav" data-page="accounting"><span class="ico">▦</span>Financeiro</button>
<button class="nav" data-page="customers"><span class="ico">♙</span>Clientes</button>
<button class="nav" data-page="reports"><span class="ico">▥</span>Relatórios</button>

<div class="sidebar-foot">PosBytz • Gestão de restaurante<br>Versão demonstrativa</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="secondary mobile-menu" id="menuBtn">☰</button><div><strong id="topTitle">Dashboard</strong><div class="muted" style="font-size:12px">Visão geral do negócio</div></div></div><div class="topright"><span id="todayDate" class="muted"></span><span id="userBadge"></span><button class="secondary" id="logoutBtn" type="button">Sair</button><button class="secondary" id="quickSale">＋ Nova venda</button></div></header>
<section class="content" id="content"></section>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Adicionar</h2><button class="secondary" id="closeModal">✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>

// --- Supabase Auth (fase 1: login e controle inicial de acesso) ---
// A chave publishable/anon pode ficar no navegador; NUNCA coloque service_role aqui.
// Confirme que estes dados correspondem ao seu projeto Supabase.
const SUPABASE_URL = 'https://sbafbopqmcwqgqokztxc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_t0pAgL-eiAIx3-r6a5tRHw_nsZrWrd3';
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser = null;
let currentProfile = null;
const adminOnlyPages = new Set(['waiters','inventory','products','accounting','customers','reports','settings']);
function authMessage(message){ const node=document.getElementById('authError'); if(node) node.textContent=message||''; }
function setAppVisible(visible){
  document.getElementById('authGate').style.display=visible?'none':'flex';
  document.getElementById('posApp').style.visibility=visible?'visible':'hidden';
}
function applyRoleAccess(){
  const isAdmin=currentProfile?.role==='admin';
  document.querySelectorAll('.nav[data-page]').forEach(btn=>{
    const restricted=adminOnlyPages.has(btn.dataset.page);
    btn.style.display=restricted&&!isAdmin?'none':'flex';
  });
  document.getElementById('userBadge').textContent =
    `${currentProfile?.full_name || currentUser?.email || 'Usuário'} • ${isAdmin?'Administrador':'Garçom'}`;
  if(!isAdmin && adminOnlyPages.has(page)) page='dashboard';
}
async function loadAuthProfile(user){
  const {data,error}=await sbClient.from('profiles').select('id,full_name,role,active').eq('id',user.id).maybeSingle();
  if(error) throw new Error('Não foi possível consultar seu perfil: '+error.message);
  if(!data) throw new Error('Sua conta não possui perfil cadastrado na tabela profiles. Peça ao administrador para conferir o cadastro.');
  if(data.active===false) throw new Error('Esta conta está desativada. Fale com o administrador.');
  if(!['admin','waiter'].includes(data.role)) throw new Error('O perfil não tem uma função reconhecida (admin/waiter).');
  currentProfile=data;
}

async function loadSharedData(){
  const {data: remoteProducts,error: productsError}=await sbClient
    .from('products').select('id,name,price,cost,stock_quantity,active,category,emoji').eq('active',true).order('id');
  if(productsError) throw new Error('Não foi possível carregar produtos: '+productsError.message);
  products=(remoteProducts||[]).map(p=>({id:p.id,name:p.name,price:Number(p.price||0),cost:Number(p.cost||0),stock:Number(p.stock_quantity||0),active:p.active,category:p.category||'Geral',emoji:p.emoji||'📦'}));

  const {data: remoteSales,error: salesError}=await sbClient
    .from('posbytz_sales').select('id,user_id,customer_id,total,profit,payment_method,status,created_at,posbytz_sale_items(id,product_id,product_name,quantity,unit_price,unit_cost)').order('created_at',{ascending:false}).limit(200);
  if(salesError) throw new Error('Não foi possível carregar vendas compartilhadas: '+salesError.message);
  orders=(remoteSales||[]).map(s=>{const d=new Date(s.created_at);return {id:String(s.id),date:d.toLocaleDateString('en-CA'),time:d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),items:(s.posbytz_sale_items||[]).map(i=>({id:i.product_id,name:i.product_name,qty:Number(i.quantity),price:Number(i.unit_price),cost:Number(i.unit_cost||0)})),total:Number(s.total||0),profit:Number(s.profit||0),payment:s.payment_method||'Pix',status:s.status||'Concluído',customerId:s.customer_id||0};});

  const {data: remoteTables,error: tablesError}=await sbClient.from('restaurant_tables').select('id,name,active').order('id');
  if(tablesError) throw new Error('Não foi possível carregar mesas: '+tablesError.message);
  tables=(remoteTables||[]).filter(t=>t.active!==false).map(t=>({id:Number(t.id),name:t.name}));
  const {data: remoteTabs,error: tabsError}=await sbClient.from('tabs').select('id,table_id,waiter_id,customer_name,status,opened_at,closed_at').order('opened_at',{ascending:false}).limit(300);
  if(tabsError) throw new Error('Não foi possível carregar comandas: '+tabsError.message);
  const allTabIds=(remoteTabs||[]).map(t=>t.id);
  let remoteTabOrders=[];
  if(allTabIds.length){const {data,error}=await sbClient.from('orders').select('id,tab_id,product_id,quantity,unit_price,status,created_at').in('tab_id',allTabIds);if(error)throw new Error('Não foi possível carregar itens das comandas: '+error.message);remoteTabOrders=data||[];}
  const {data: profiles}=await sbClient.from('profiles').select('id,full_name,role,active').eq('active',true);
  const profileNames=new Map((profiles||[]).map(x=>[String(x.id),x.full_name||'Usuário']));
  const tableNames=new Map(tables.map(t=>[Number(t.id),t.name]));
  const itemMap=new Map();
  for(const row of remoteTabOrders){const key=String(row.tab_id);if(!itemMap.has(key))itemMap.set(key,[]);const p=products.find(x=>Number(x.id)===Number(row.product_id));itemMap.get(key).push({id:Number(row.product_id),orderId:Number(row.id),name:p?.name||'Produto removido',price:Number(row.unit_price||0),cost:Number(p?.cost||0),stock:Number(p?.stock||0),qty:Number(row.quantity||0),emoji:p?.emoji||'📦',category:p?.category||'Geral'});}
  comandas=(remoteTabs||[]).map(t=>({id:String(t.id),tableId:Number(t.table_id),tableName:tableNames.get(Number(t.table_id))||('Mesa '+t.table_id),waiterId:String(t.waiter_id||''),waiterName:profileNames.get(String(t.waiter_id))||(String(t.waiter_id)===String(currentUser?.id)?(currentProfile?.full_name||'Usuário'):'Equipe'),guest:t.customer_name||'',items:itemMap.get(String(t.id))||[],status:['open','aberta','aberto'].includes(String(t.status||'').toLowerCase())?'Aberta':'Fechada',openedAt:t.opened_at?new Date(t.opened_at).toLocaleString('pt-BR'):'',closedAt:t.closed_at?new Date(t.closed_at).toLocaleString('pt-BR'):''}));
  save();
}
let sharedRealtimeChannel=null;
function startSharedRealtime(){
  if(sharedRealtimeChannel) sbClient.removeChannel(sharedRealtimeChannel);
  sharedRealtimeChannel=sbClient.channel('posbytz-shared-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>refreshSharedView())
    .on('postgres_changes',{event:'*',schema:'public',table:'restaurant_tables'},()=>refreshSharedView())
    .on('postgres_changes',{event:'*',schema:'public',table:'tabs'},()=>refreshSharedView())
    .on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>refreshSharedView())
    .on('postgres_changes',{event:'*',schema:'public',table:'posbytz_sales'},()=>refreshSharedView())
    .on('postgres_changes',{event:'*',schema:'public',table:'posbytz_sale_items'},()=>refreshSharedView())
    .subscribe();
}
let refreshInProgress=false, refreshQueued=false;
async function refreshSharedView(){
  if(!currentUser)return;
  if(refreshInProgress){refreshQueued=true;return;}
  refreshInProgress=true;
  try{await loadSharedData();render();}catch(err){console.error('Falha ao sincronizar:',err);}
  finally{refreshInProgress=false;if(refreshQueued){refreshQueued=false;refreshSharedView();}}
}
async function enterWithSession(session){
  if(!session?.user){currentUser=null;currentProfile=null;setAppVisible(false);return;}
  currentUser=session.user;
  try {
  authMessage('Login aceito. Carregando perfil...');
  await loadAuthProfile(currentUser);
  authMessage('Perfil carregado. Carregando dados...');
  await loadSharedData();
  authMessage('Dados carregados. Iniciando sincronização...');
  startSharedRealtime();
  applyRoleAccess();
  setAppVisible(true);
  render();
} catch(err) {
  console.error('Erro ao carregar o sistema:', err);
  authMessage('Erro ao entrar: ' + (err.message || String(err)));
}
}
document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();
const emailDigitado = document.getElementById('authEmail').value;
const senhaDigitada = document.getElementById('authPassword').value;
authMessage('Verificando login...');
  const button=document.getElementById('authSubmit'); button.disabled=true; button.textContent='Entrando…';
  try{
      const {data,error}=await sbClient.auth.signInWithPassword({
  email: emailDigitado.trim(),
  password: senhaDigitada
});
    if(error) throw error;
    await enterWithSession(data.session);
  }catch(err){console.error('ERRO LOGIN:',err);authMessage('Erro: '+(err.message||String(err)));}
  finally{button.disabled=false;button.textContent='Entrar';}
});
document.getElementById('logoutBtn').addEventListener('click',async()=>{
  if(sharedRealtimeChannel){await sbClient.removeChannel(sharedRealtimeChannel);sharedRealtimeChannel=null;}
  await sbClient.auth.signOut(); currentUser=null;currentProfile=null;setAppVisible(false);authMessage('');
});
sbClient.auth.onAuthStateChange((_event,session)=>{ if(session?.user && !currentUser) setTimeout(()=>enterWithSession(session),0); });

const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toLocaleDateString('pt-BR');
document.getElementById('todayDate').textContent=today();
const starterProducts=[
{id:1,name:'Espetinho de carne',category:'Espetinhos',price:12,cost:5,stock:35,emoji:'🍢'},
{id:2,name:'Espetinho de frango',category:'Espetinhos',price:10,cost:4,stock:28,emoji:'🍗'},
{id:3,name:'Bolincha com bacon',category:'Espetinhos',price:15,cost:6,stock:22,emoji:'🥓'},
{id:4,name:'Cerveja lata',category:'Bebidas',price:6,cost:3.5,stock:48,emoji:'🥤'},
{id:5,name:'Refrigerante',category:'Bebidas',price:5,cost:2,stock:30,emoji:'🧃'},
{id:6,name:'Água mineral',category:'Bebidas',price:3,cost:1,stock:24,emoji:'💧'},
{id:7,name:'Queijo coalho',category:'Espetinhos',price:10,cost:4,stock:16,emoji:'🧀'},
{id:8,name:'Porção de batata',category:'Porções',price:18,cost:7,stock:9,emoji:'🍟'}
];
let products=JSON.parse(localStorage.getItem('pb_products')||'null')||starterProducts;
let orders=JSON.parse(localStorage.getItem('pb_orders')||'null')||[];
let customers=JSON.parse(localStorage.getItem('pb_customers')||'null')||[];
let expenses=JSON.parse(localStorage.getItem('pb_expenses')||'null')||[];
let waiters=JSON.parse(localStorage.getItem('pb_waiters')||'null')||[{id:1,name:'Garçom 1',active:true},{id:2,name:'Garçom 2',active:true}];
let tables=JSON.parse(localStorage.getItem('pb_tables')||'null')||Array.from({length:15},(_,i)=>({id:i+1,name:'Mesa '+(i+1)}));
let comandas=JSON.parse(localStorage.getItem('pb_comandas')||'null')||[];
let cart=[];let page='dashboard';
const save=()=>{localStorage.setItem('pb_products',JSON.stringify(products));localStorage.setItem('pb_orders',JSON.stringify(orders));localStorage.setItem('pb_customers',JSON.stringify(customers));localStorage.setItem('pb_expenses',JSON.stringify(expenses));localStorage.setItem('pb_waiters',JSON.stringify(waiters));localStorage.setItem('pb_tables',JSON.stringify(tables));localStorage.setItem('pb_comandas',JSON.stringify(comandas));};
const el=(id)=>document.getElementById(id);
function toast(msg){el('toast').textContent=msg;el('toast').style.display='block';setTimeout(()=>el('toast').style.display='none',2400)}
function setPage(p){if(currentProfile?.role!=='admin' && adminOnlyPages.has(p)){toast('Acesso exclusivo do administrador.');return;}page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));el('topTitle').textContent=({dashboard:'Dashboard',pos:'Frente de caixa',orders:'Pedidos',comandas:'Mesas e comandas',waiters:'Garçons',inventory:'Estoque',products:'Produtos',accounting:'Financeiro',customers:'Clientes',reports:'Relatórios',settings:'Configurações'})[p];el('sidebar').classList.remove('open');render()}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
el('menuBtn').onclick=()=>el('sidebar').classList.toggle('open');el('quickSale').onclick=()=>setPage('pos');el('closeModal').onclick=()=>el('modal').classList.remove('show');
function openModal(title,html,after){el('modalTitle').textContent=title;el('modalBody').innerHTML=html;el('modal').classList.add('show');if(after)after()}
function stat(title,value,icon,sub=''){return `<div class="card stat"><div class="stat-icon">${icon}</div><div><label>${title}</label><div class="value">${value}</div><small>${sub}</small></div></div>`}
function pageHead(title,sub,button=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function todayOrders(){return orders.filter(o=>o.date===new Date().toLocaleDateString('en-CA'))}
function dashboard(){let os=todayOrders(),sales=os.reduce((s,o)=>s+o.total,0),profit=os.reduce((s,o)=>s+o.profit,0),low=products.filter(p=>p.stock<=10);let days=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
let chart=days.map((d,i)=>{
  let dt=new Date();
  dt.setHours(12,0,0,0);
  dt.setDate(dt.getDate()-(6-i));

  return {d,v:orders.filter(o=>o.date===key).reduce((s,o)=>s+o.total,0)};
});

<div class="footer-note">Produtos, estoque, vendas e comandas são compartilhados pelo Supabase. Clientes e despesas ainda são locais neste navegador.</div>`}
function topProducts(){let m={};orders.forEach(o=>o.items.forEach(i=>{m[i.id]??={name:i.name,emoji:i.emoji,qty:0,total:0};m[i.id].qty+=i.qty;m[i.id].total+=i.price*i.qty}));return Object.values(m).sort((a,b)=>b.qty-a.qty).slice(0,5)}

function productCards(arr){return arr.map(p=>`<div class="card product"><div class="emoji">${p.emoji||'📦'}</div><strong>${p.name}</strong><small>${p.category} · Estoque: ${p.stock}</small><div class="price">${money(p.price)}</div><button ${p.stock<=0?'disabled style="opacity:.45"':''} onclick="addCart(${p.id})">Adicionar</button></div>`).join('')||'<div class="empty">Nenhum produto encontrado.</div>'}

function addCart(id){let p=products.find(p=>p.id===id);if(!p||p.stock<=0)return toast('Produto sem estoque.');let i=cart.find(i=>i.id===id);if(i){if(i.qty>=p.stock)return toast('Estoque insuficiente.');i.qty++}else cart.push({...p,qty:1});render()}
function cartHTML(){return cart.length?cart.map(i=>`<div class="cart-line"><div><strong>${i.name}</strong><div class="muted">${money(i.price)} cada</div></div><div class="qty"><button onclick="changeQty(${i.id},-1)">−</button><strong>${i.qty}</strong><button onclick="changeQty(${i.id},1)">+</button></div><strong>${money(i.price*i.qty)}</strong></div>`).join(''):'<div class="empty">Adicione produtos ao pedido.</div>'}
function changeQty(id,d){let i=cart.find(i=>i.id===id),p=products.find(p=>p.id===id);if(!i)return;if(d>0&&i.qty>=p.stock)return toast('Estoque insuficiente.');i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);render()}

async function finishSale(){
  if(!cart.length)return toast('Adicione pelo menos um produto.');
  if(!currentUser)return toast('Faça login novamente antes de registrar a venda.');
  const button=document.querySelector('[onclick="finishSale()"]');
  if(button){button.disabled=true;button.textContent='Conferindo produtos…'}
  let saleId=null;
  try{
    // Revalidate each cart item against the database and use the actual FK id.
    const verified=[];
    for(const item of cart){
      const {data:dbProduct,error:productError}=await sbClient.from('products')
        .select('id,name,price,cost,stock_quantity,active').eq('id',Number(item.id)).maybeSingle();
      if(productError)throw new Error('Não foi possível conferir o produto '+item.name+': '+productError.message);
      if(!dbProduct){
        const {data:byName,error:byNameError}=await sbClient.from('products')
          .select('id,name,price,cost,stock_quantity,active').eq('name',item.name).maybeSingle();
        if(byNameError)throw byNameError;
        if(!byName)throw new Error('O produto “'+item.name+'” não existe na tabela products. Atualize a página e escolha o produto carregado do banco.');
        verified.push({...item,id:Number(byName.id),price:Number(byName.price),cost:Number(byName.cost||0),stock:Number(byName.stock_quantity||0)});
      }else{
        if(dbProduct.active===false)throw new Error('O produto “'+item.name+'” está inativo.');
        if(Number(dbProduct.stock_quantity||0)<item.qty)throw new Error('Estoque insuficiente para '+item.name+'. Estoque no banco: '+dbProduct.stock_quantity+'.');
        verified.push({...item,id:Number(dbProduct.id),price:Number(dbProduct.price),cost:Number(dbProduct.cost||0),stock:Number(dbProduct.stock_quantity||0)});
      }
    }
    for(const item of verified){
      const {data:check,error:checkError}=await sbClient.from('products').select('id').eq('id',item.id).maybeSingle();
      if(checkError)throw checkError;
      if(!check)throw new Error('ID de produto inválido antes de salvar: '+item.id+' ('+item.name+').');
    }
    const total=verified.reduce((sum,item)=>sum+item.price*item.qty,0);
    const cost=verified.reduce((sum,item)=>sum+item.cost*item.qty,0);
    const payment=el('payment')?.value||'Pix';
    if(button)button.textContent='Salvando venda…';
    const {data:sale,error:saleError}=await sbClient.from('posbytz_sales').insert({
      user_id:currentUser.id,total,profit:total-cost,payment_method:payment,status:'Concluído'
    }).select('id').single();
    if(saleError)throw saleError;
    saleId=sale.id;
    const rows=verified.map(item=>({
      sale_id:sale.id,product_id:item.id,product_name:item.name,
      quantity:item.qty,unit_price:item.price,unit_cost:item.cost||0
    }));
    const {error:itemsError}=await sbClient.from('posbytz_sale_items').insert(rows);
    if(itemsError){
      // Remove the empty sale header if inserting its items fails.
      await sbClient.from('posbytz_sales').delete().eq('id',sale.id);
      saleId=null;
      throw new Error('Falha ao salvar itens (produto ID '+rows.map(r=>r.product_id).join(', ')+'): '+itemsError.message);
    }
    const order={id:String(sale.id),date:new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0'),
      time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
      items:verified.map(item=>({...item})),total,profit:total-cost,payment,status:'Concluído'};
    orders.unshift(order);
    cart=[];
    await loadSharedData();
    setPage('orders');toast('Venda salva no banco compartilhado!');
  }catch(err){
    toast('Não foi possível salvar no banco: '+(err.message||'erro desconhecido'));
  }finally{if(button){button.disabled=false;button.textContent='Finalizar venda'}}
}

function adjustStock(id){let p=products.find(p=>p.id===id);openModal('Ajustar estoque',`<div class="field"><label>Produto</label><strong>${p.name}</strong></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Quantidade atual</label><input disabled value="${p.stock}"></div><div class="field"><label>Nova quantidade</label><input id="newStock" type="number" min="0" value="${p.stock}"></div></div><button style="margin-top:16px;width:100%" onclick="saveStock(${id})">Salvar quantidade</button>`)}

async function saveProduct(id){
  if(currentProfile?.role!=='admin')return toast('Somente o administrador pode alterar produtos.');
  let name=el('pName').value.trim(),price=Number(el('pPrice').value),cost=Number(el('pCost').value),stock=Number(el('pStock').value);
  if(!name||el('pPrice').value===''||price<0||cost<0||stock<0)return toast('Preencha nome, preço, custo e estoque corretamente.');
  const payload={name,category:el('pCategory').value.trim()||'Geral',price,cost,stock_quantity:Math.floor(stock),emoji:el('pEmoji').value.trim()||'📦',active:true};
  try{
    let result;
    if(id) result=await sbClient.from('products').update(payload).eq('id',Number(id)).select('id').single();
    else result=await sbClient.from('products').insert(payload).select('id').single();
    if(result.error)throw result.error;
    el('modal').classList.remove('show');
    await loadSharedData();render();toast('Produto salvo no banco compartilhado.');
  }catch(err){toast('Não foi possível salvar o produto no banco: '+(err.message||'erro desconhecido')+'. Confira as políticas RLS de products.');}
}

function saveCustomer(){let name=el('cName').value.trim();if(!name)return toast('Informe o nome do cliente.');customers.push({id:Date.now(),name,phone:el('cPhone').value.trim(),email:el('cEmail').value.trim()});save();el('modal').classList.remove('show');render();toast('Cliente cadastrado.')}
function deleteCustomer(id){if(!confirm('Excluir cliente?'))return;customers=customers.filter(c=>c.id!==id);save();render()}
function reports(){let rev=orders.reduce((s,o)=>s+o.total,0),cost=orders.reduce((s,o)=>s+o.total-o.profit,0);return `${pageHead('Relatórios','Indicadores baseados nos pedidos e produtos registrados.')}<div class="grid stats">${stat('Vendas acumuladas',money(rev),'↗')}${stat('Custo dos itens vendidos',money(cost),'▤')}${stat('Lucro bruto',money(rev-cost),'R$')}${stat('Número de pedidos',orders.length,'▱')}</div><div class="grid two"><div class="card"><div class="card-title"><h2>Produtos mais vendidos</h2><button class="secondary" onclick="exportCSV('top')">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Unidades</th><th>Faturamento</th></tr></thead><tbody>${topProducts().map(p=>`<tr><td>${p.emoji} ${p.name}</td><td>${p.qty}</td><td>${money(p.total)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem dados ainda.</td></tr>'}</tbody></table></div></div><div class="card"><h2 style="margin-bottom:16px">Por forma de pagamento</h2>${[...new Set(orders.map(o=>o.payment))].map(pay=>`<div class="totalrow"><span>${pay}</span><strong>${money(orders.filter(o=>o.payment===pay).reduce((s,o)=>s+o.total,0))}</strong></div>`).join('')||'<div class="empty">Sem vendas registradas.</div>'}</div></div><div class="card" style="margin-top:16px"><div class="card-title"><h2>Exportar dados</h2></div><p class="muted" style="margin-bottom:14px">Baixe os dados para abrir em planilha.</p><div class="toolbar"><button onclick="exportCSV('orders')">Pedidos CSV</button><button onclick="exportCSV('products')">Produtos CSV</button><button onclick="exportCSV('expenses')">Despesas CSV</button><button onclick="exportCSV('customers')">Clientes CSV</button></div></div>`}
function settings(){return `${pageHead('Configurações','Preferências básicas e cópia de segurança local.')}<div class="grid two"><div class="card"><h2 style="margin-bottom:14px">Dados da empresa</h2><div class="field"><label>Nome do estabelecimento</label><input id="bizName" value="${localStorage.getItem('pb_bizName')||'Meu Restaurante'}"></div><div class="field" style="margin-top:12px"><label>Moeda</label><select disabled><option>Real brasileiro (BRL)</option></select></div><button style="margin-top:16px" onclick="localStorage.setItem('pb_bizName',el('bizName').value);toast('Nome salvo localmente.')">Salvar configurações</button></div><div class="card"><h2 style="margin-bottom:14px">Backup e dados</h2><p class="muted" style="line-height:1.6;margin-bottom:14px">Exporte uma cópia dos produtos, pedidos, clientes e despesas para guardar seus dados.</p><button onclick="backup()">Baixar backup JSON</button> <button class="secondary" onclick="el('restoreFile').click()">Restaurar backup</button><input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="danger" onclick="resetDemo()">Restaurar dados de exemplo</button></div></div><div class="notice" style="margin-top:16px">Produtos, estoque, vendas e comandas são carregados do Supabase. A sincronização em tempo real depende de executar a instalação SQL fornecida e habilitar as tabelas na publicação Realtime. Clientes, despesas e algumas preferências ainda ficam neste navegador.</div>`}
function exportCSV(type){let rows=[],name=type;const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';if(type==='orders'){rows=[['Pedido','Data','Hora','Pagamento','Total','Lucro bruto','Itens'],...orders.map(o=>[o.id,o.date,o.time,o.payment,o.total,o.profit,o.items.map(i=>i.qty+'x '+i.name).join('; ')])]}else if(type==='products'){rows=[['ID','Produto','Categoria','Preço','Custo','Estoque'],...products.map(p=>[p.id,p.name,p.category,p.price,p.cost,p.stock])]}else if(type==='expenses'){rows=[['Data','Descrição','Categoria','Valor'],...expenses.map(e=>[e.date,e.description,e.category,e.value])]}else if(type==='customers'){rows=[['Nome','Telefone','Email'],...customers.map(c=>[c.name,c.phone,c.email])]}else if(type==='top'){rows=[['Produto','Unidades','Faturamento'],...topProducts().map(p=>[p.name,p.qty,p.total])]}let csv='\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='posbytz_'+name+'.csv';a.click();URL.revokeObjectURL(a.href)}
function backup(){let data={products,orders,customers,expenses,waiters,tables,comandas,bizName:localStorage.getItem('pb_bizName')||'Meu Restaurante'};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='posbytz_backup.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw Error();products=d.products;orders=d.orders;customers=d.customers||[];expenses=d.expenses||[];waiters=d.waiters||waiters;tables=d.tables||tables;comandas=d.comandas||[];localStorage.setItem('pb_bizName',d.bizName||'Meu Restaurante');save();render();toast('Backup restaurado.')}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(f);ev.target.value=''}
function resetDemo(){if(!confirm('Isso substituirá os dados atuais pelos dados iniciais e apagará vendas/clientes/despesas deste navegador. Continuar?'))return;products=starterProducts.map(p=>({...p}));orders=[];customers=[];expenses=[];cart=[];save();render();toast('Dados de exemplo restaurados.')}

function waiterOptions(selected=''){const id=String(currentUser?.id||'');const name=currentProfile?.full_name||currentUser?.email||'Usuário logado';return `<option value="${id}" selected>${name} (usuário logado)</option>`}
function openComandaModal(tableId=null){
 const freeTables=tables.filter(t=>!comandas.some(c=>c.tableId===t.id&&c.status==='Aberta'));
 openModal('Abrir comanda',`<div class="formgrid"><div class="field"><label>Mesa</label><select id="comTable">${(tableId?tables.filter(t=>t.id===tableId):freeTables).map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div><div class="field"><label>Garçom responsável</label><select id="comWaiter">${waiterOptions()}</select></div><div class="field"><label>Cliente (opcional)</label><input id="comGuest" placeholder="Ex.: Família da janela"></div></div><button style="width:100%;margin-top:16px" onclick="createComanda()">Abrir comanda</button>`)
}
async function createComanda(){
 const tableId=Number(el('comTable')?.value);
  const customerName=el('comGuest')?.value?.trim()||null;
 if(!tableId)return toast('Não há mesa livre disponível.');
 if(!currentUser)return toast('Faça login novamente para abrir uma comanda.');
 if(comandas.some(c=>c.tableId===tableId&&c.status==='Aberta'))return toast('Essa mesa já possui comanda aberta.');
 try{
  const {data,error}=await sbClient.from('tabs').insert({table_id:tableId,waiter_id:currentUser.id,customer_name:customerName,status:'open'}).select('id').single();
  if(error)throw error;
  el('modal').classList.remove('show');await loadSharedData();setPage('comandas');toast('Comanda aberta e compartilhada entre os dispositivos.');
 }catch(err){toast('Não foi possível abrir a comanda: '+err.message);}
}
function comandasPage(){
 let open=comandas.filter(c=>c.status==='Aberta');
 return `${pageHead('Mesas e comandas','Abra comandas, atribua garçons e lance o consumo de cada mesa.',`<button onclick="openComandaModal()">＋ Abrir comanda</button>`)}
 <div class="grid stats">${stat('Comandas abertas',open.length,'🍽','Mesas em atendimento')}${stat('Mesas cadastradas',tables.length,'▦','Capacidade configurada')}${stat('Consumo em aberto',money(open.reduce((s,c)=>s+c.items.reduce((a,i)=>a+i.price*i.qty,0),0)),'🧾','Ainda não fechado')}${stat('Garçons ativos',waiters.filter(w=>w.active).length,'♙','Equipe de atendimento')}</div>
 <div class="grid products" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${tables.map(t=>{let c=comandas.find(c=>c.tableId===t.id&&c.status==='Aberta');let total=c?c.items.reduce((s,i)=>s+i.price*i.qty,0):0;return `<div class="card"><div class="card-title"><h2>${t.name}</h2><span class="pill ${c?'warn':''}">${c?'Ocupada':'Livre'}</span></div>${c?`<p class="muted">Comanda #${c.id}</p><p style="margin:8px 0"><strong>Garçom:</strong> ${c.waiterName}</p><p class="muted">${c.guest||'Sem identificação de cliente'}</p><div class="totalrow"><span>Itens lançados</span><strong>${c.items.reduce((s,i)=>s+i.qty,0)}</strong></div><div class="totalrow"><span>Parcial</span><strong>${money(total)}</strong></div><button style="width:100%" onclick="manageComanda('${c.id}')">Abrir comanda</button>`:`<p class="muted" style="margin:12px 0 18px">Mesa disponível para atendimento.</p><button style="width:100%" onclick="openComandaModal(${t.id})">Abrir comanda</button>`}</div>`}).join('')}</div>
 <div class="card" style="margin-top:18px"><div class="card-title"><h2>Comandas fechadas</h2></div><div class="tablewrap"><table><thead><tr><th>Comanda</th><th>Mesa</th><th>Garçom</th><th>Fechada</th><th>Total</th></tr></thead><tbody>${comandas.filter(c=>c.status==='Fechada').slice(0,30).map(c=>`<tr><td>#${c.id}</td><td>${c.tableName}</td><td>${c.waiterName}</td><td>${c.closedAt||'—'}</td><td>${money(c.items.reduce((s,i)=>s+i.price*i.qty,0))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma comanda fechada ainda.</td></tr>'}</tbody></table></div></div>`
}
function manageComanda(id){
 let c=comandas.find(c=>String(c.id)===String(id));if(!c)return;
 let total=c.items.reduce((s,i)=>s+i.price*i.qty,0);
 openModal(`Comanda #${c.id} — ${c.tableName}`,`<div class="field"><label>Garçom responsável</label><select id="editComWaiter" onchange="updateComandaWaiter('${c.id}',this.value)">${waiterOptions(c.waiterId)}</select></div>
 <div class="field" style="margin-top:10px"><label>Adicionar item</label><select id="comProduct">${products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${p.name} — ${money(p.price)} (estoque ${p.stock})</option>`).join('')}</select></div>
 <div class="field" style="margin-top:10px"><label>Quantidade</label><input id="comQty" type="number" min="1" value="1"></div><button style="width:100%;margin-top:10px" onclick="addToComanda('${c.id}')">＋ Lançar item</button>
 <div style="margin-top:18px"><h3>Consumo da mesa</h3>${c.items.length?c.items.map((i,idx)=>`<div class="cart-line"><div><strong>${i.name}</strong><div class="muted">${money(i.price)} cada</div></div><div class="qty"><button onclick="changeComandaQty('${c.id}',${idx},-1)">−</button><strong>${i.qty}</strong><button onclick="changeComandaQty('${c.id}',${idx},1)">+</button></div><strong>${money(i.price*i.qty)}</strong></div>`).join(''):'<div class="empty">Nenhum item lançado ainda.</div>'}</div>
 <div class="totalrow" style="font-size:20px;margin-top:18px"><strong>Total parcial</strong><strong>${money(total)}</strong></div><div class="field"><label>Forma de pagamento ao fechar</label><select id="comPayment"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option></select></div><button style="width:100%;margin-top:12px" onclick="closeComanda('${c.id}')">Fechar comanda e registrar venda</button>`)
}
async function updateComandaWaiter(id, waiterId){
 // O vínculo da comanda usa o perfil autenticado (UUID), não o cadastro local de garçons.
 const c=comandas.find(c=>String(c.id)===String(id));if(!c)return;
 if(String(waiterId)!==String(currentUser?.id))return toast('A comanda fica vinculada ao usuário autenticado.');
 const {error}=await sbClient.from('tabs').update({waiter_id:currentUser.id}).eq('id',Number(id));
 if(error)toast('Não foi possível atualizar o responsável: '+error.message);else await loadSharedData();
}
async function addToComanda(id){
 const c=comandas.find(c=>String(c.id)===String(id)),p=products.find(p=>p.id===Number(el('comProduct')?.value)),qty=Math.floor(Number(el('comQty')?.value||1));
 if(!c||c.status!=='Aberta'||!p||qty<1)return toast('Confira a comanda, o produto e a quantidade.');
 const current=c.items.find(i=>i.id===p.id)?.qty||0;
 if(current+qty>p.stock)return toast('Quantidade maior que o estoque disponível.');
 try{const {error}=await sbClient.from('orders').insert({tab_id:Number(id),product_id:p.id,quantity:qty,unit_price:p.price,status:'pending'});if(error)throw error;await loadSharedData();manageComanda(id);toast('Item lançado e sincronizado.');}
 catch(err){toast('Não foi possível lançar o item: '+err.message);}
}
async function changeComandaQty(id,idx,d){
 const c=comandas.find(c=>String(c.id)===String(id));if(!c||c.status!=='Aberta')return;
 const i=c.items[idx],p=products.find(p=>p.id===i?.id);if(!i)return;
 if(d>0&&(i.qty+1)>(p?.stock||0))return toast('Estoque insuficiente.');
 try{
  if(i.qty+d<=0){const {error}=await sbClient.from('orders').delete().eq('id',i.orderId);if(error)throw error;}
  else {const {error}=await sbClient.from('orders').update({quantity:i.qty+d}).eq('id',i.orderId);if(error)throw error;}
  await loadSharedData();manageComanda(id);
 }catch(err){toast('Não foi possível alterar a quantidade: '+err.message);}
}
async function closeComanda(id){
 const c=comandas.find(c=>String(c.id)===String(id));if(!c||!c.items.length)return toast('Lance pelo menos um item antes de fechar.');
 const payment=el('comPayment')?.value||'Pix';
 try{
  const {data,error}=await sbClient.rpc('close_pos_tab',{p_tab_id:Number(id),p_payment_method:payment});
  if(error)throw error;
  el('modal').classList.remove('show');await loadSharedData();setPage('comandas');toast('Comanda fechada, estoque atualizado e venda registrada.');
 }catch(err){toast('Não foi possível fechar a comanda: '+err.message+'. Confira se executou o arquivo SQL de instalação.');}
}
function waitersPage(){return `${pageHead('Garçons','Cadastre a equipe e veja quem está responsável por cada comanda.',`<button onclick="openWaiterModal()">＋ Cadastrar garçom</button>`)}<div class="card"><div class="tablewrap"><table><thead><tr><th>Garçom</th><th>Status</th><th>Comandas abertas</th><th>Consumo em atendimento</th><th>Ações</th></tr></thead><tbody>${waiters.map(w=>{let cs=comandas.filter(c=>c.status==='Aberta'&&c.waiterId===w.id);return `<tr><td><strong>♙ ${w.name}</strong></td><td><span class="pill ${w.active?'':'off'}">${w.active?'Ativo':'Inativo'}</span></td><td>${cs.length}</td><td>${money(cs.reduce((s,c)=>s+c.items.reduce((a,i)=>a+i.price*i.qty,0),0))}</td><td><div class="row-actions"><button class="secondary" onclick="toggleWaiter(${w.id})">${w.active?'Desativar':'Ativar'}</button><button class="secondary" onclick="renameWaiter(${w.id})">Renomear</button></div></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Cadastre o primeiro garçom.</td></tr>'}</tbody></table></div></div><p class="footer-note">Garçons desativados deixam de aparecer em novas comandas. Comandas já abertas preservam o responsável.</p>`}
function openWaiterModal(){openModal('Cadastrar garçom',`<div class="field"><label>Nome do garçom</label><input id="waiterName" placeholder="Ex.: João"></div><button style="width:100%;margin-top:16px" onclick="saveWaiter()">Cadastrar</button>`)}
function saveWaiter(){let name=el('waiterName').value.trim();if(!name)return toast('Informe o nome.');waiters.push({id:Math.max(0,...waiters.map(w=>w.id))+1,name,active:true});save();el('modal').classList.remove('show');render();toast('Garçom cadastrado.')}
function toggleWaiter(id){let w=waiters.find(w=>w.id===id);if(w){w.active=!w.active;save();render()}}
function renameWaiter(id){let w=waiters.find(w=>w.id===id);if(!w)return;let n=prompt('Nome do garçom:',w.name);if(n&&n.trim()){w.name=n.trim();comandas.filter(c=>c.waiterId===id&&c.status==='Aberta').forEach(c=>c.waiterName=w.name);save();render()}}

function render(){el('content').innerHTML=({dashboard, pos, orders:ordersPage, comandas:comandasPage, waiters:waitersPage, inventory, products:productsPage, accounting, customers:customersPage, reports, settings})[page]()}
render();
</script>
</body></html>
